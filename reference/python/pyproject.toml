[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blugit"
version = "0.1.0"
description = "Minimal Git over Bluetooth RFCOMM prototype"
requires-python = ">=3.11"
dependencies = ["aio-rfcomm==1.1.0"]

[project.scripts]
blugit = "blugit.cli:main"
git-remote-blugit = "blugit.helper:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
