[package]
name = "blugit"
version = "0.3.1"
edition = "2024"
description = "Git over offline Bluetooth RFCOMM"
default-run = "blugit"

[features]
default = []
# Enables loopback transport exclusively for automated tests. Do not use in releases.
test-transport = []

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dunce = "1"
dirs = "6"
hex = "0.4"
hostname = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snow = "0.10"
spake2 = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "process", "sync", "time", "signal"] }
uuid = "1"

[target.'cfg(windows)'.dependencies]
socket2 = { version = "0.6", features = ["all"] }
windows-sys = { version = "0.61", features = ["Win32_Devices_Bluetooth", "Win32_Networking_WinSock", "Win32_Foundation", "Win32_System_Com"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["rfcomm", "bluetoothd"] }
futures-util = "0.3"

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "blugit"
path = "src/main.rs"

[[bin]]
name = "git-remote-blugit"
path = "src/bin/git-remote-blugit.rs"
